<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Weekend Explorer</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM (Production Versions) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Load Babel to compile JSX syntax in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar hiding utility for Tailwind */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#F4F5F8] selection:bg-indigo-200">
    <div id="root"></div>

    <script type="text/babel">
        // Extract React hooks from the globally loaded React object
        const { useState, useEffect, useMemo } = React;

        // Small fallback dataset just in case the external JSON file fails to load
        // This is perfect for quick testing directly in the browser or Canvas.
        const initialData = [
          {
            id: 'greenwich', name: 'Greenwich',
            season: 'October. The autumn foliage in Greenwich Park against the backdrop of the Royal Observatory and the city skyline is stunning.',
            soul: 'The maritime epicentre of Britain, a royal birthplace, and the historic home of time. It feels like a grand, nautical village completely removed from the frantic energy of central London.',
            day2: 'Walk the Thames Path to the O2 Peninsula and take the IFS Cloud Cable Car across the river for aerial photography. Alternatively, dive deep into the National Maritime Museum.',
            visitedDate: '', rating: 0, notes: '',
            todo: [
              { id: 'g_t1', text: 'Explore the Old Royal Naval College, specifically the breathtaking Painted Hall.', checked: false },
              { id: 'g_t2', text: 'Walk up the steep hill in Greenwich Park to the Royal Observatory.', checked: false },
              { id: 'g_t3', text: 'Wander through Greenwich Market to browse local arts, crafts, and antiques.', checked: false }
            ],
            photo: [
              { id: 'g_p1', text: "The viewpoint from the Royal Observatory hill: capture the Queen's House with Canary Wharf behind it.", checked: false },
              { id: 'g_p2', text: 'The Painted Hall ceiling (a wide-angle lens is highly recommended here).', checked: false }
            ],
            eat: [
              { id: 'g_e1', text: 'Arapina Bakery: Cozy spot for vegetarian, vegan, and GF artisan pastries/coffees.', checked: false },
              { id: 'g_e2', text: 'Prince of Greenwich Pub: Quirky Victorian decor. Excellent vegetarian and GF pizzas.', checked: false }
            ]
          },
          {
            id: 'hampstead', name: 'Hampstead & Highgate',
            season: 'November (for crisp, moody fog and autumn leaves) or May (to capture blooming wisteria).',
            soul: 'An intellectual and literary haven that feels like a rural 18th-century English village perched on a hill.',
            day2: 'Explore Highgate Village, Waterlow Park, and take the full architectural tour of Highgate West Cemetery.',
            visitedDate: '', rating: 0, notes: '',
            todo: [
              { id: 'h_t1', text: 'Get lost in the wild woods, meadows, and swimming ponds of Hampstead Heath.', checked: false },
              { id: 'h_t2', text: 'Wander the steep, cobbled streets and historic alleyways (like Flask Walk).', checked: false }
            ],
            photo: [
              { id: 'h_p1', text: 'Parliament Hill viewpoint on Hampstead Heath for sweeping skyline views.', checked: false },
              { id: 'h_p2', text: 'The overgrown, ivy-draped Victorian gravestones in the West Cemetery of Highgate.', checked: false }
            ],
            eat: [
              { id: 'h_e1', text: 'The Swing (West Hampstead): Vegetable-focused casual restaurant with vibrant small plates.', checked: false },
              { id: 'h_e2', text: 'The Holly Bush: Historic pub. Excellent vegetarian roasts, very accommodating for GF.', checked: false }
            ]
          }
        ];

        const seasonKeywords = {
          'Spring': ['march', 'april', 'may', 'spring'],
          'Summer': ['june', 'july', 'august', 'summer'],
          'Autumn': ['september', 'october', 'november', 'autumn', 'fall'],
          'Winter': ['december', 'january', 'february', 'winter']
        };

        const StarRating = ({ rating, onChange, readOnly = false }) => {
          return (
            <div className="flex space-x-1">
              {[1, 2, 3, 4, 5].map(star => (
                <svg
                  key={star}
                  onClick={() => !readOnly && onChange(star)}
                  className={`w-7 h-7 ${readOnly ? '' : 'cursor-pointer hover:scale-110'} transition-all duration-300 ${star <= rating ? 'text-[#FFBA28]' : 'text-gray-300'}`}
                  fill="currentColor"
                  viewBox="0 0 20 20"
                >
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                </svg>
              ))}
            </div>
          )
        };

        const ChecklistItem = ({ item, index, totalItems, onToggle, onMoveUp, onMoveDown }) => {
          return (
            <div className={`flex items-start justify-between p-4 mb-3 rounded-2xl transition-colors duration-300 ${item.checked ? 'bg-[#F0F2F5] opacity-75' : 'bg-[#F8F9FB] hover:bg-[#F0F2F5]'}`}>
              <div className="flex items-start flex-1 cursor-pointer" onClick={() => onToggle(item.id)}>
                <button 
                  className={`mt-0.5 flex-shrink-0 w-6 h-6 rounded-md flex items-center justify-center mr-4 transition-all duration-300 ${item.checked ? 'bg-[#4F46E5] text-white border-[#4F46E5]' : 'bg-white border-2 border-gray-400 hover:border-[#4F46E5]'}`}
                >
                  {item.checked && (
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                  )}
                </button>
                <span className={`text-[15px] leading-relaxed pr-2 ${item.checked ? 'line-through text-gray-500' : 'text-gray-800 font-medium'}`}>
                  {item.text}
                </span>
              </div>
              
              <div className="flex flex-col space-y-2 ml-2 pl-2">
                <button 
                  onClick={() => onMoveUp(index)} 
                  disabled={index === 0}
                  className={`p-1.5 rounded-full transition-colors ${index === 0 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-200 hover:text-gray-900'}`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 15l7-7 7 7" /></svg>
                </button>
                <button 
                  onClick={() => onMoveDown(index)} 
                  disabled={index === totalItems - 1}
                  className={`p-1.5 rounded-full transition-colors ${index === totalItems - 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-200 hover:text-gray-900'}`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M19 9l-7 7-7-7" /></svg>
                </button>
              </div>
            </div>
          );
        };

        const ChecklistGroup = ({ title, items, icon, onToggle, onMoveUp, onMoveDown }) => {
          return (
            <div className="mb-8">
              <h3 className="flex items-center text-lg font-bold text-gray-900 mb-4 px-1">
                <span className="mr-3 p-2 bg-[#E0E7FF] text-[#4F46E5] rounded-xl">{icon}</span>
                {title}
              </h3>
              <div>
                {items.map((item, idx) => (
                  <ChecklistItem 
                    key={item.id} 
                    item={item} 
                    index={idx} 
                    totalItems={items.length} 
                    onToggle={onToggle}
                    onMoveUp={onMoveUp}
                    onMoveDown={onMoveDown}
                  />
                ))}
              </div>
            </div>
          );
        };

        function LondonExplorerApp() {
          const [areas, setAreas] = useState([]);
          const [currentView, setCurrentView] = useState('list'); // 'list' | 'detail'
          const [activeAreaId, setActiveAreaId] = useState(null);
          
          const [searchTerm, setSearchTerm] = useState('');
          const [selectedSeason, setSelectedSeason] = useState('All');

          // Load from local storage, OR fetch from JSON, OR use fallback data
          useEffect(() => {
            const loadData = async () => {
              // Note: Using V3 key to prevent conflicts with old cached data while testing new structure
              const savedData = localStorage.getItem('londonWeekendTrackerDataV3');
              if (savedData) {
                setAreas(JSON.parse(savedData));
                return;
              }

              try {
                // Attempt to fetch the external JSON file
                const response = await fetch('./london_data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const jsonData = await response.json();
                setAreas(jsonData);
                localStorage.setItem('londonWeekendTrackerDataV3', JSON.stringify(jsonData));
                
              } catch (error) {
                console.warn("Could not load external JSON (likely running locally without a server). Falling back to sample data.", error);
                // Fallback to the 2 areas defined at the top of the file
                setAreas(initialData);
              }
            };
            
            loadData();
          }, []);

          // Save to local storage whenever areas change
          useEffect(() => {
            if (areas.length > 0) {
              localStorage.setItem('londonWeekendTrackerDataV3', JSON.stringify(areas));
            }
          }, [areas]);

          // General Updater
          const updateArea = (areaId, field, value) => {
            setAreas(prev => prev.map(a => a.id === areaId ? { ...a, [field]: value } : a));
          };

          const toggleCheck = (areaId, category, itemId) => {
            setAreas(prev => prev.map(a => {
              if (a.id !== areaId) return a;
              return {
                ...a,
                [category]: a[category].map(item => item.id === itemId ? { ...item, checked: !item.checked } : item)
              };
            }));
          };

          const reorderList = (areaId, category, index, direction) => {
            setAreas(prev => prev.map(a => {
              if (a.id !== areaId) return a;
              const newList = [...a[category]];
              const targetIndex = direction === 'up' ? index - 1 : index + 1;
              
              const temp = newList[index];
              newList[index] = newList[targetIndex];
              newList[targetIndex] = temp;
              
              return { ...a, [category]: newList };
            }));
          };

          // View Controllers
          const openDetail = (id) => {
            setActiveAreaId(id);
            setCurrentView('detail');
            window.scrollTo(0,0);
          };

          const goBack = () => {
            setCurrentView('list');
            setActiveAreaId(null);
            window.scrollTo(0,0);
          };

          const filteredAreas = useMemo(() => {
            return areas.filter(area => {
              const lowerSearch = searchTerm.toLowerCase();
              const matchesSearch = !searchTerm || 
                area.name.toLowerCase().includes(lowerSearch) || 
                area.soul.toLowerCase().includes(lowerSearch) ||
                area.season.toLowerCase().includes(lowerSearch);

              let matchesSeason = true;
              if (selectedSeason !== 'All') {
                const keywords = seasonKeywords[selectedSeason];
                const lowerAreaSeason = area.season.toLowerCase();
                matchesSeason = keywords.some(kw => lowerAreaSeason.includes(kw));
              }

              return matchesSearch && matchesSeason;
            });
          }, [areas, searchTerm, selectedSeason]);

          const activeArea = areas.find(a => a.id === activeAreaId);
          const visitedCount = areas.filter(a => a.visitedDate !== '' || a.rating > 0).length;

          if (currentView === 'list') {
            return (
              <div className="min-h-screen bg-[#F4F5F8] font-sans pb-12 selection:bg-indigo-200">
                <header className="bg-[#F4F5F8] text-gray-900 px-6 py-6 sticky top-0 z-10 transition-shadow">
                  <div className="max-w-3xl mx-auto flex justify-between items-end">
                    <div>
                      <h1 className="text-3xl font-black tracking-tight text-gray-900">London Explorer</h1>
                      <p className="text-[#4F46E5] text-sm mt-1 font-bold tracking-wide uppercase">Weekend Tracker</p>
                    </div>
                    <div className="text-right">
                      <span className="block text-3xl font-bold text-gray-900">{visitedCount}<span className="text-lg text-gray-400">/{areas.length}</span></span>
                      <span className="text-xs text-gray-500 uppercase font-bold tracking-widest">Visited</span>
                    </div>
                  </div>
                </header>

                <div className="max-w-3xl mx-auto px-4">
                  <div className="relative mb-4 group">
                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                       <svg className="w-5 h-5 text-gray-500 group-focus-within:text-[#4F46E5] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                    <input 
                      type="text" 
                      placeholder="Search neighbourhoods, vibes, or seasons..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-12 pr-4 py-4 bg-[#E2E4E9] text-gray-900 rounded-full font-medium placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#4F46E5] transition-all"
                    />
                  </div>

                  <div className="flex space-x-2 overflow-x-auto pb-6 scrollbar-hide">
                    {['All', 'Spring', 'Summer', 'Autumn', 'Winter'].map(season => (
                      <button
                        key={season}
                        onClick={() => setSelectedSeason(season)}
                        className={`px-5 py-2 rounded-full whitespace-nowrap text-sm font-bold transition-all duration-300 ${
                          selectedSeason === season 
                          ? 'bg-[#4F46E5] text-white shadow-md' 
                          : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-100'
                        }`}
                      >
                        {season}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    {filteredAreas.length === 0 && (
                      <div className="col-span-1 sm:col-span-2 text-center py-10 text-gray-500 font-medium">
                        No neighbourhoods match your search.
                      </div>
                    )}
                    
                    {filteredAreas.map(area => {
                      const isVisited = area.visitedDate !== '' || area.rating > 0;
                      const totalTasks = area.todo.length + area.photo.length + area.eat.length;
                      const completedTasks = [...area.todo, ...area.photo, ...area.eat].filter(i => i.checked).length;
                      const progressPercentage = Math.round((completedTasks / totalTasks) * 100);

                      return (
                        <div 
                          key={area.id} 
                          onClick={() => openDetail(area.id)}
                          className="bg-white rounded-[24px] shadow-sm hover:shadow-md border border-gray-100/50 p-5 cursor-pointer transition-all duration-300 relative overflow-hidden group flex flex-col justify-between"
                        >
                          {isVisited && (
                            <div className="absolute top-0 right-0 bg-[#10B981] text-white text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-bl-xl">
                              Visited
                            </div>
                          )}
                          
                          <div>
                            <h2 className="text-[19px] font-bold text-gray-900 pr-10 mb-1 group-hover:text-[#4F46E5] transition-colors">{area.name}</h2>
                            <p className="text-sm text-gray-500 line-clamp-2 mt-1 leading-relaxed font-medium">
                              {area.soul}
                            </p>
                          </div>
                          
                          <div className="flex justify-between items-end mt-5">
                            <div className="w-[55%]">
                              <div className="flex justify-between text-xs text-gray-500 mb-1.5 font-bold">
                                <span>Checklist</span>
                                <span>{progressPercentage}%</span>
                              </div>
                              <div className="w-full bg-[#E2E4E9] rounded-full h-2">
                                <div className={`h-2 rounded-full transition-all duration-500 ${progressPercentage === 100 ? 'bg-[#10B981]' : 'bg-[#4F46E5]'}`} style={{ width: `${progressPercentage}%` }}></div>
                              </div>
                            </div>
                            
                            <div className="flex-shrink-0">
                              {isVisited ? (
                                 <StarRating rating={area.rating} readOnly={true} />
                              ) : (
                                <span className="bg-[#F0F2F5] text-gray-600 px-3 py-1.5 rounded-full text-xs font-bold group-hover:bg-[#E0E7FF] group-hover:text-[#4F46E5] transition-colors">
                                  Explore →
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            );
          }

          if (currentView === 'detail' && activeArea) {
            return (
              <div className="min-h-screen bg-[#F4F5F8] font-sans pb-24 selection:bg-indigo-200">
                <header className="bg-[#F4F5F8] sticky top-0 z-20 pt-4 pb-2 px-4 transition-all">
                  <div className="max-w-2xl mx-auto flex items-center">
                    <button 
                      onClick={goBack}
                      className="mr-3 p-2 bg-white rounded-full shadow-sm hover:shadow-md hover:bg-gray-50 transition-all text-gray-700"
                    >
                      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    </button>
                    <h1 className="text-xl font-bold text-gray-900 truncate pl-2">{activeArea.name}</h1>
                  </div>
                </header>

                <div className="max-w-2xl mx-auto px-4 mt-4">
                  <div className="bg-white rounded-[28px] shadow-sm border border-gray-100 p-6 mb-8">
                    <h3 className="text-[13px] font-black uppercase tracking-widest text-[#4F46E5] mb-5 flex items-center">
                      <svg className="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      Your Tracker
                    </h3>
                    
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-5 space-y-4 sm:space-y-0">
                      <div className="flex-1 mr-4">
                        <label className="block text-sm font-bold text-gray-700 mb-2">Date Visited</label>
                        <input 
                          type="date" 
                          value={activeArea.visitedDate}
                          onChange={(e) => updateArea(activeArea.id, 'visitedDate', e.target.value)}
                          className="w-full sm:w-auto px-4 py-2.5 bg-[#F0F2F5] text-gray-900 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-[#4F46E5] focus:bg-white transition-all outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-2">Overall Rating</label>
                        <StarRating 
                          rating={activeArea.rating} 
                          onChange={(val) => updateArea(activeArea.id, 'rating', val)} 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">Personal Notes</label>
                      <textarea 
                        value={activeArea.notes}
                        onChange={(e) => updateArea(activeArea.id, 'notes', e.target.value)}
                        placeholder="Write your memories, favorite moments, or things to remember..."
                        className="w-full px-4 py-3 bg-[#F0F2F5] text-gray-900 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-[#4F46E5] focus:bg-white transition-all outline-none min-h-[120px] resize-y"
                      />
                    </div>
                  </div>

                  <div className="grid sm:grid-cols-2 gap-4 mb-8">
                    <div className="bg-[#E0E7FF] rounded-[24px] p-5">
                      <h4 className="text-xs font-black uppercase tracking-widest text-[#4F46E5] mb-2 flex items-center">
                        <svg className="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        Best Season
                      </h4>
                      <p className="text-[15px] font-medium text-[#3730A3] leading-relaxed">{activeArea.season}</p>
                    </div>
                    
                    <div className="bg-[#FFEDD5] rounded-[24px] p-5">
                      <h4 className="text-xs font-black uppercase tracking-widest text-[#EA580C] mb-2 flex items-center">
                        <svg className="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                        The Soul
                      </h4>
                      <p className="text-[15px] font-medium text-[#9A3412] leading-relaxed">{activeArea.soul}</p>
                    </div>
                  </div>

                  <div className="bg-white rounded-[28px] shadow-sm border border-gray-100 p-2 pt-6 sm:p-6 mb-8">
                    <ChecklistGroup 
                      title="Things to Do" 
                      items={activeArea.todo} 
                      icon={<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>}
                      onToggle={(itemId) => toggleCheck(activeArea.id, 'todo', itemId)}
                      onMoveUp={(idx) => reorderList(activeArea.id, 'todo', idx, 'up')}
                      onMoveDown={(idx) => reorderList(activeArea.id, 'todo', idx, 'down')}
                    />

                    <ChecklistGroup 
                      title="Photography Hotspots" 
                      items={activeArea.photo} 
                      icon={<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>}
                      onToggle={(itemId) => toggleCheck(activeArea.id, 'photo', itemId)}
                      onMoveUp={(idx) => reorderList(activeArea.id, 'photo', idx, 'up')}
                      onMoveDown={(idx) => reorderList(activeArea.id, 'photo', idx, 'down')}
                    />

                    <ChecklistGroup 
                      title="Eateries (Veg + GF Friendly)" 
                      items={activeArea.eat} 
                      icon={<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg>}
                      onToggle={(itemId) => toggleCheck(activeArea.id, 'eat', itemId)}
                      onMoveUp={(idx) => reorderList(activeArea.id, 'eat', idx, 'up')}
                      onMoveDown={(idx) => reorderList(activeArea.id, 'eat', idx, 'down')}
                    />
                  </div>

                  <div className="bg-[#F3E8FF] rounded-[24px] p-6 shadow-sm border border-purple-100">

                      Weekend Extension (Day 2)

                    <p className="text-[15px] font-medium text-[#581C87] leading-relaxed">{activeArea.day2}</p>

                </div>

            );
          }

          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LondonExplorerApp />);
    </script>
