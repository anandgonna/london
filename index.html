<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Weekend Explorer</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM (Production Versions) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Load Babel to compile JSX syntax in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar hiding utility for Tailwind */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#F4F5F8] dark:bg-gray-900 selection:bg-indigo-200 dark:selection:bg-indigo-500 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        // Extract React hooks from the globally loaded React object
        const { useState, useEffect, useMemo, useRef } = React;

        // Small fallback dataset just in case the external JSON file fails to load
        // This is perfect for quick testing directly in the browser or Canvas.
        const initialData = [
          {
            id: 'greenwich', name: 'Greenwich',
            season: 'October. The autumn foliage in Greenwich Park against the backdrop of the Royal Observatory and the city skyline is stunning.',
            soul: 'The maritime epicentre of Britain, a royal birthplace, and the historic home of time. It feels like a grand, nautical village completely removed from the frantic energy of central London.',
            day2: 'Walk the Thames Path to the O2 Peninsula and take the IFS Cloud Cable Car across the river for aerial photography. Alternatively, dive deep into the National Maritime Museum.',
            visitedDate: '', rating: 0, notes: '',
            todo: [
              { id: 'g_t1', text: 'Explore the Old Royal Naval College, specifically the breathtaking Painted Hall.', checked: false },
              { id: 'g_t2', text: 'Walk up the steep hill in Greenwich Park to the Royal Observatory.', checked: false },
              { id: 'g_t3', text: 'Wander through Greenwich Market to browse local arts, crafts, and antiques.', checked: false }
            ],
            photo: [
              { id: 'g_p1', text: "The viewpoint from the Royal Observatory hill: capture the Queen's House with Canary Wharf behind it.", checked: false },
              { id: 'g_p2', text: 'The Painted Hall ceiling (a wide-angle lens is highly recommended here).', checked: false }
            ],
            eat: [
              { id: 'g_e1', text: 'Arapina Bakery: Cozy spot for vegetarian, vegan, and GF artisan pastries/coffees.', checked: false },
              { id: 'g_e2', text: 'Prince of Greenwich Pub: Quirky Victorian decor. Excellent vegetarian and GF pizzas.', checked: false }
            ]
          },
          {
            id: 'hampstead', name: 'Hampstead & Highgate',
            season: 'November (for crisp, moody fog and autumn leaves) or May (to capture blooming wisteria).',
            soul: 'An intellectual and literary haven that feels like a rural 18th-century English village perched on a hill.',
            day2: 'Explore Highgate Village, Waterlow Park, and take the full architectural tour of Highgate West Cemetery.',
            visitedDate: '', rating: 0, notes: '',
            todo: [
              { id: 'h_t1', text: 'Get lost in the wild woods, meadows, and swimming ponds of Hampstead Heath.', checked: false },
              { id: 'h_t2', text: 'Wander the steep, cobbled streets and historic alleyways (like Flask Walk).', checked: false }
            ],
            photo: [
              { id: 'h_p1', text: 'Parliament Hill viewpoint on Hampstead Heath for sweeping skyline views.', checked: false },
              { id: 'h_p2', text: 'The overgrown, ivy-draped Victorian gravestones in the West Cemetery of Highgate.', checked: false }
            ],
            eat: [
              { id: 'h_e1', text: 'The Swing (West Hampstead): Vegetable-focused casual restaurant with vibrant small plates.', checked: false },
              { id: 'h_e2', text: 'The Holly Bush: Historic pub. Excellent vegetarian roasts, very accommodating for GF.', checked: false }
            ]
          }
        ];

        const seasonKeywords = {
          'Spring': ['march', 'april', 'may', 'spring'],
          'Summer': ['june', 'july', 'august', 'summer'],
          'Autumn': ['september', 'october', 'november', 'autumn', 'fall'],
          'Winter': ['december', 'january', 'february', 'winter']
        };

        const seasonChips = [
          { name: 'All', emoji: '🌍' },
          { name: 'Spring', emoji: '🌸' },
          { name: 'Summer', emoji: '☀️' },
          { name: 'Autumn', emoji: '🍂' },
          { name: 'Winter', emoji: '❄️' }
        ];

        const StarRating = ({ rating, onChange, readOnly = false }) => {
          return (
            <div className="flex space-x-1">
              {[1, 2, 3, 4, 5].map(star => (
                <svg
                  key={star}
                  onClick={() => !readOnly && onChange(star)}
                  className={`w-7 h-7 ${readOnly ? '' : 'cursor-pointer hover:scale-110 hover:-translate-y-1'} transition-all duration-300 ${star <= rating ? 'text-[#FFBA28] dark:text-[#FBBF24] drop-shadow-md' : 'text-gray-300 dark:text-gray-600'}`}
                  fill="currentColor"
                  viewBox="0 0 20 20"
                >
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                </svg>
              ))}
            </div>
          )
        };

        const ChecklistItem = ({ item, index, totalItems, onToggle, onMoveUp, onMoveDown }) => {
          return (
            <div className={`flex items-start justify-between p-4 mb-3 rounded-2xl transition-all duration-300 ${item.checked ? 'bg-[#F0F2F5] dark:bg-gray-800/60 opacity-75' : 'bg-[#F8F9FB] dark:bg-gray-800 hover:bg-[#F0F2F5] dark:hover:bg-gray-700 hover:shadow-sm'}`}>
              <div className="flex items-start flex-1 cursor-pointer" onClick={() => onToggle(item.id)}>
                <button 
                  className={`mt-0.5 flex-shrink-0 w-6 h-6 rounded-md flex items-center justify-center mr-4 transition-all duration-300 ${item.checked ? 'bg-[#4F46E5] dark:bg-indigo-500 text-white border-[#4F46E5] dark:border-indigo-500' : 'bg-white dark:bg-gray-900 border-2 border-gray-400 dark:border-gray-500 hover:border-[#4F46E5] dark:hover:border-indigo-400'}`}
                >
                  {item.checked && (
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                  )}
                </button>
                <span className={`text-[15px] leading-relaxed pr-2 transition-colors ${item.checked ? 'line-through text-gray-500 dark:text-gray-500' : 'text-gray-800 dark:text-gray-100 font-medium'}`}>
                  {item.text}
                </span>
              </div>
              
              <div className="flex flex-col space-y-2 ml-2 pl-2">
                <button 
                  onClick={() => onMoveUp(index)} 
                  disabled={index === 0}
                  className={`p-1.5 rounded-full transition-colors ${index === 0 ? 'text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-600 hover:text-gray-900 dark:hover:text-white'}`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 15l7-7 7 7" /></svg>
                </button>
                <button 
                  onClick={() => onMoveDown(index)} 
                  disabled={index === totalItems - 1}
                  className={`p-1.5 rounded-full transition-colors ${index === totalItems - 1 ? 'text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-600 hover:text-gray-900 dark:hover:text-white'}`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M19 9l-7 7-7-7" /></svg>
                </button>
              </div>
            </div>
          );
        };

        const ChecklistGroup = ({ title, items, icon, onToggle, onMoveUp, onMoveDown }) => {
          return (
            <div className="mb-8">
              <h3 className="flex items-center text-lg font-bold text-gray-900 dark:text-gray-100 mb-4 px-1">
                <span className="mr-3 p-2 bg-[#E0E7FF] dark:bg-indigo-900/40 text-[#4F46E5] dark:text-indigo-300 rounded-xl shadow-sm transform transition hover:scale-110 hover:rotate-6">{icon}</span>
                {title}
              </h3>
              <div>
                {items.map((item, idx) => (
                  <ChecklistItem 
                    key={item.id} 
                    item={item} 
                    index={idx} 
                    totalItems={items.length} 
                    onToggle={onToggle}
                    onMoveUp={onMoveUp}
                    onMoveDown={onMoveDown}
                  />
                ))}
              </div>
            </div>
          );
        };

        function LondonExplorerApp() {
          const [areas, setAreas] = useState([]);
          const [currentView, setCurrentView] = useState('list'); // 'list' | 'detail'
          const [activeAreaId, setActiveAreaId] = useState(null);
          
          const [searchTerm, setSearchTerm] = useState('');
          const [selectedSeason, setSelectedSeason] = useState('All');

          const trackerRef = useRef(null);

          // Load from local storage, OR fetch from JSON, OR use fallback data
          useEffect(() => {
            const loadData = async () => {
              // Note: Using V3 key to prevent conflicts with old cached data while testing new structure
              const savedData = localStorage.getItem('londonWeekendTrackerDataV3');
              if (savedData) {
                setAreas(JSON.parse(savedData));
                return;
              }

              try {
                // Attempt to fetch the external JSON file
                const response = await fetch('./london_data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const jsonData = await response.json();
                setAreas(jsonData);
                localStorage.setItem('londonWeekendTrackerDataV3', JSON.stringify(jsonData));
                
              } catch (error) {
                console.warn("Could not load external JSON (likely running locally without a server). Falling back to sample data.", error);
                // Fallback to the 2 areas defined at the top of the file
                setAreas(initialData);
              }
            };
            
            loadData();
          }, []);

          // Save to local storage whenever areas change
          useEffect(() => {
            if (areas.length > 0) {
              localStorage.setItem('londonWeekendTrackerDataV3', JSON.stringify(areas));
            }
          }, [areas]);

          // General Updater
          const updateArea = (areaId, field, value) => {
            setAreas(prev => prev.map(a => a.id === areaId ? { ...a, [field]: value } : a));
          };

          const toggleCheck = (areaId, category, itemId) => {
            setAreas(prev => prev.map(a => {
              if (a.id !== areaId) return a;
              return {
                ...a,
                [category]: a[category].map(item => item.id === itemId ? { ...item, checked: !item.checked } : item)
              };
            }));
          };

          const reorderList = (areaId, category, index, direction) => {
            setAreas(prev => prev.map(a => {
              if (a.id !== areaId) return a;
              const newList = [...a[category]];
              const targetIndex = direction === 'up' ? index - 1 : index + 1;
              
              const temp = newList[index];
              newList[index] = newList[targetIndex];
              newList[targetIndex] = temp;
              
              return { ...a, [category]: newList };
            }));
          };

          // View Controllers
          const openDetail = (id) => {
            setActiveAreaId(id);
            setCurrentView('detail');
            window.scrollTo(0,0);
          };

          const goBack = () => {
            setCurrentView('list');
            setActiveAreaId(null);
            window.scrollTo(0,0);
          };

          const scrollToTracker = () => {
            if (trackerRef.current) {
              trackerRef.current.scrollIntoView({ behavior: 'smooth' });
            }
          };

          const filteredAreas = useMemo(() => {
            return areas.filter(area => {
              const lowerSearch = searchTerm.toLowerCase();
              const matchesSearch = !searchTerm || 
                area.name.toLowerCase().includes(lowerSearch) || 
                area.soul.toLowerCase().includes(lowerSearch) ||
                area.season.toLowerCase().includes(lowerSearch);

              let matchesSeason = true;
              if (selectedSeason !== 'All') {
                const keywords = seasonKeywords[selectedSeason];
                const lowerAreaSeason = area.season.toLowerCase();
                matchesSeason = keywords.some(kw => lowerAreaSeason.includes(kw));
              }

              return matchesSearch && matchesSeason;
            });
          }, [areas, searchTerm, selectedSeason]);

          const activeArea = areas.find(a => a.id === activeAreaId);
          const visitedCount = areas.filter(a => a.visitedDate !== '' || a.rating > 0).length;

          if (currentView === 'list') {
            return (
              <div className="min-h-screen bg-[#F4F5F8] dark:bg-gray-900 font-sans pb-12 selection:bg-indigo-200 dark:selection:bg-indigo-500 transition-colors duration-300">
                <header className="bg-[#F4F5F8] dark:bg-gray-900 text-gray-900 dark:text-white px-6 py-6 sticky top-0 z-10 transition-shadow">
                  <div className="max-w-3xl mx-auto flex justify-between items-end">
                    <div>
                      <h1 className="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-[#4F46E5] to-[#EC4899] dark:from-[#818CF8] dark:to-[#F472B6]">🇬🇧 London Explorer</h1>
                      <p className="text-[#4F46E5] dark:text-indigo-400 text-sm mt-1 font-bold tracking-wide uppercase">✨ Weekend Tracker</p>
                    </div>
                    <div className="text-right">
                      <span className="block text-3xl font-bold text-gray-900 dark:text-white">{visitedCount}<span className="text-lg text-gray-400 dark:text-gray-500">/{areas.length}</span></span>
                      <span className="text-xs text-gray-500 dark:text-gray-400 uppercase font-bold tracking-widest">Visited</span>
                    </div>
                  </div>
                </header>

                <div className="max-w-3xl mx-auto px-4">
                  <div className="relative mb-4 group">
                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                       <span className="text-lg grayscale group-focus-within:grayscale-0 transition-all duration-300">🔍</span>
                    </div>
                    <input 
                      type="text" 
                      placeholder="Search neighbourhoods, vibes, or seasons..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-12 pr-4 py-4 bg-[#E2E4E9] dark:bg-gray-800 text-gray-900 dark:text-white rounded-full font-medium placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#4F46E5] dark:focus:ring-indigo-500 shadow-sm transition-all"
                    />
                  </div>

                  <div className="flex space-x-2 overflow-x-auto pb-6 scrollbar-hide">
                    {seasonChips.map(({name, emoji}) => (
                      <button
                        key={name}
                        onClick={() => setSelectedSeason(name)}
                        className={`px-5 py-2.5 rounded-full whitespace-nowrap text-sm font-bold transition-all duration-300 flex items-center space-x-2 ${
                          selectedSeason === name 
                          ? 'bg-gradient-to-r from-[#4F46E5] to-[#6366F1] dark:from-indigo-500 dark:to-indigo-600 text-white shadow-lg transform hover:scale-105' 
                          : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:shadow-sm'
                        }`}
                      >
                        <span>{emoji}</span>
                        <span>{name}</span>
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    {filteredAreas.length === 0 && (
                      <div className="col-span-1 sm:col-span-2 text-center py-10 text-gray-500 dark:text-gray-400 font-medium">
                        No neighbourhoods match your search. 🕵️‍♂️
                      </div>
                    )}
                    
                    {filteredAreas.map(area => {
                      const isVisited = area.visitedDate !== '' || area.rating > 0;
                      const totalTasks = area.todo.length + area.photo.length + area.eat.length;
                      const completedTasks = [...area.todo, ...area.photo, ...area.eat].filter(i => i.checked).length;
                      const progressPercentage = Math.round((completedTasks / totalTasks) * 100);

                      return (
                        <div 
                          key={area.id} 
                          onClick={() => openDetail(area.id)}
                          className={`bg-white dark:bg-gray-800 rounded-[24px] shadow-sm hover:shadow-xl border p-5 cursor-pointer transform transition-all duration-300 hover:-translate-y-1 relative overflow-hidden group flex flex-col justify-between ${isVisited ? 'border-[#10B981]/50 dark:border-emerald-500/50 bg-emerald-50/30 dark:bg-emerald-900/10' : 'border-gray-100/50 dark:border-gray-700'}`}
                        >
                          {isVisited && (
                            <div className="absolute top-0 right-0 bg-gradient-to-r from-[#10B981] to-[#34D399] dark:from-emerald-600 dark:to-emerald-500 text-white text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-bl-xl shadow-sm z-10">
                              ✅ Visited
                            </div>
                          )}
                          
                          <div>
                            <h2 className="text-[19px] font-bold text-gray-900 dark:text-white pr-10 mb-1 group-hover:text-[#4F46E5] dark:group-hover:text-indigo-400 transition-colors">{area.name}</h2>
                            <p className="text-sm text-gray-500 dark:text-gray-400 line-clamp-2 mt-1 leading-relaxed font-medium">
                              {area.soul}
                            </p>
                          </div>
                          
                          <div className="flex justify-between items-end mt-5">
                            <div className="w-[55%]">
                              <div className="flex justify-between text-xs text-gray-500 dark:text-gray-400 mb-1.5 font-bold">
                                <span>Checklist</span>
                                <span>{progressPercentage}%</span>
                              </div>
                              <div className="w-full bg-[#E2E4E9] dark:bg-gray-700 rounded-full h-2 overflow-hidden shadow-inner">
                                <div className={`h-full rounded-full transition-all duration-500 ${progressPercentage === 100 ? 'bg-[#10B981] dark:bg-emerald-500' : 'bg-[#4F46E5] dark:bg-indigo-500'}`} style={{ width: `${progressPercentage}%` }}></div>
                              </div>
                            </div>
                            
                            <div className="flex-shrink-0">
                              {isVisited ? (
                                 <StarRating rating={area.rating} readOnly={true} />
                              ) : (
                                <span className="bg-[#F0F2F5] dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-3 py-1.5 rounded-full text-xs font-bold group-hover:bg-[#E0E7FF] dark:group-hover:bg-indigo-900/50 group-hover:text-[#4F46E5] dark:group-hover:text-indigo-300 transition-colors">
                                  Explore 🚀
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            );
          }

          if (currentView === 'detail' && activeArea) {
            return (
              <div className="min-h-screen bg-[#F4F5F8] dark:bg-gray-900 font-sans pb-24 selection:bg-indigo-200 dark:selection:bg-indigo-500 transition-colors duration-300">
                <header className="bg-[#F4F5F8] dark:bg-gray-900 sticky top-0 z-20 pt-4 pb-2 px-4 transition-all backdrop-blur-md bg-opacity-90 dark:bg-opacity-90">
                  <div className="max-w-2xl mx-auto flex items-center">
                    <button 
                      onClick={goBack}
                      className="mr-3 p-2 bg-white dark:bg-gray-800 rounded-full shadow-sm hover:shadow-md hover:bg-gray-50 dark:hover:bg-gray-700 transition-all text-gray-700 dark:text-gray-200"
                    >
                      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    </button>
                    <h1 className="text-xl font-bold text-gray-900 dark:text-white truncate pl-2">{activeArea.name}</h1>
                  </div>
                </header>

                <div className="max-w-2xl mx-auto px-4 mt-4 space-y-8">
                  {/* Jump to tracker button */}
                  <div className="flex justify-end mb-2">
                    <button 
                      onClick={scrollToTracker} 
                      className="text-xs font-bold uppercase tracking-wide text-[#4F46E5] dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 px-4 py-2.5 rounded-full hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition-colors flex items-center shadow-sm"
                    >
                      Jump to Tracker <span className="text-base ml-1.5">👇</span>
                    </button>
                  </div>

                  <div className="grid sm:grid-cols-2 gap-4">
                    <div className="bg-[#E0E7FF] dark:bg-indigo-900/30 rounded-[24px] p-5 shadow-sm transform transition hover:-translate-y-1">
                      <h4 className="text-xs font-black uppercase tracking-widest text-[#4F46E5] dark:text-indigo-300 mb-2 flex items-center">
                        <span className="text-base mr-1.5">🌦️</span> Best Season
                      </h4>
                      <p className="text-[15px] font-medium text-[#3730A3] dark:text-indigo-200 leading-relaxed">{activeArea.season}</p>
                    </div>
                    
                    <div className="bg-[#FFEDD5] dark:bg-orange-900/30 rounded-[24px] p-5 shadow-sm transform transition hover:-translate-y-1">
                      <h4 className="text-xs font-black uppercase tracking-widest text-[#EA580C] dark:text-orange-300 mb-2 flex items-center">
                        <span className="text-base mr-1.5">✨</span> The Soul
                      </h4>
                      <p className="text-[15px] font-medium text-[#9A3412] dark:text-orange-200 leading-relaxed">{activeArea.soul}</p>
                    </div>
                  </div>

                  <div className="bg-white dark:bg-gray-800 rounded-[28px] shadow-sm border border-gray-100 dark:border-gray-700 p-2 pt-6 sm:p-6">
                    <ChecklistGroup 
                      title="Things to Do" 
                      items={activeArea.todo} 
                      icon={<span className="text-xl">📍</span>}
                      onToggle={(itemId) => toggleCheck(activeArea.id, 'todo', itemId)}
                      onMoveUp={(idx) => reorderList(activeArea.id, 'todo', idx, 'up')}
                      onMoveDown={(idx) => reorderList(activeArea.id, 'todo', idx, 'down')}
                    />

                    <ChecklistGroup 
                      title="Photography Hotspots" 
                      items={activeArea.photo} 
                      icon={<span className="text-xl">📸</span>}
                      onToggle={(itemId) => toggleCheck(activeArea.id, 'photo', itemId)}
                      onMoveUp={(idx) => reorderList(activeArea.id, 'photo', idx, 'up')}
                      onMoveDown={(idx) => reorderList(activeArea.id, 'photo', idx, 'down')}
                    />

                    <ChecklistGroup 
                      title="Eateries (Veg + GF Friendly)" 
                      items={activeArea.eat} 
                      icon={<span className="text-xl">🥑</span>}
                      onToggle={(itemId) => toggleCheck(activeArea.id, 'eat', itemId)}
                      onMoveUp={(idx) => reorderList(activeArea.id, 'eat', idx, 'up')}
                      onMoveDown={(idx) => reorderList(activeArea.id, 'eat', idx, 'down')}
                    />
                  </div>

                  <div className="bg-gradient-to-br from-[#F3E8FF] to-[#E0E7FF] dark:from-purple-900/40 dark:to-indigo-900/40 rounded-[24px] p-6 shadow-md border border-purple-100 dark:border-purple-800/50 mb-8 transform transition hover:-translate-y-1">
                    <h4 className="text-xs font-black uppercase tracking-widest text-[#7E22CE] dark:text-purple-300 mb-3 flex items-center">
                      <span className="text-lg mr-2">🎒</span> Weekend Extension (Day 2)
                    </h4>
                    <p className="text-[15px] font-medium text-[#581C87] dark:text-purple-200 leading-relaxed">{activeArea.day2}</p>
                  </div>

                  <div ref={trackerRef} className="bg-white dark:bg-gray-800 rounded-[28px] shadow-sm hover:shadow-md transition-shadow border border-gray-100 dark:border-gray-700 p-6 scroll-mt-24">
                    <h3 className="text-[13px] font-black uppercase tracking-widest text-[#4F46E5] dark:text-indigo-400 mb-5 flex items-center">
                      <span className="text-lg mr-2">📝</span> Your Tracker
                    </h3>
                    
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-5 space-y-4 sm:space-y-0">
                      <div className="flex-1 mr-4">
                        <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Date Visited 📅</label>
                        <input 
                          type="date" 
                          value={activeArea.visitedDate}
                          onChange={(e) => updateArea(activeArea.id, 'visitedDate', e.target.value)}
                          className="w-full sm:w-auto px-4 py-2.5 bg-[#F0F2F5] dark:bg-gray-900 text-gray-900 dark:text-white border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-[#4F46E5] dark:focus:ring-indigo-500 focus:bg-white dark:focus:bg-gray-700 transition-all outline-none shadow-inner"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Overall Rating ⭐</label>
                        <StarRating 
                          rating={activeArea.rating} 
                          onChange={(val) => updateArea(activeArea.id, 'rating', val)} 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Personal Notes 💭</label>
                      <textarea 
                        value={activeArea.notes}
                        onChange={(e) => updateArea(activeArea.id, 'notes', e.target.value)}
                        placeholder="Write your memories, favorite moments, or things to remember..."
                        className="w-full px-4 py-3 bg-[#F0F2F5] dark:bg-gray-900 text-gray-900 dark:text-white border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-[#4F46E5] dark:focus:ring-indigo-500 focus:bg-white dark:focus:bg-gray-700 transition-all outline-none min-h-[120px] resize-y shadow-inner"
                      />
                    </div>
                  </div>

                </div>
              </div>
            );
          }

          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LondonExplorerApp />);
    </script>
</body>
</html>
