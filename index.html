    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234F46E5'/><text x='50' y='72' font-size='70' text-anchor='middle'>💂</text></svg>">

    <script>
      // Generate a crisp high-res PNG icon on-the-fly for iOS & Android home screen installation
      (function() {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 192;
          canvas.height = 192;
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.fillStyle = '#4F46E5';
            ctx.beginPath();
            ctx.arc(96, 96, 92, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = '112px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💂', 96, 102);
            const pngUrl = canvas.toDataURL('image/png');
            
            const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleIcon) appleIcon.href = pngUrl;

            const manifest = {
              name: 'London Weekend Explorer',
              short_name: 'London Explorer',
              start_url: '.',
              display: 'standalone',
              background_color: '#F4F5F8',
              theme_color: '#4F46E5',
              icons: [{ src: pngUrl, sizes: '192x192', type: 'image/png' }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = URL.createObjectURL(manifestBlob);
            document.head.appendChild(manifestLink);
          }
        } catch (e) {}
      })();
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        darkMode: 'class',
      }

</head>

        const seasonKeywords = {

        const StarRating = ({ rating, onChange, readOnly = false }) => {
          return (

              {[1, 2, 3, 4, 5].map(star => (

        const ChecklistItem = ({ item, onToggle, areaName, isEatery = false }) => {
          const mapQuery = useMemo(() => {
            let baseText = item.title || item.text;
            let queryText = baseText.split(/[:\.\(]/)[0].trim();
            queryText = queryText.replace(/^(Explore|Wander|Walk|Visit|Marvel at|Hunt for|Browse|Catch|See|Relax in|Get lost in|Walk around|Watch|Take|Pay respects at|Spend an afternoon|Be overwhelmed by|Eat your way through|Stroll|Hike|Tour|Discover)\s+/i, '');

                    className="inline-flex items-center space-x-1 text-gray-900 dark:text-gray-100 bg-gray-100 dark:bg-gray-800 hover:bg-indigo-100 dark:hover:bg-indigo-950/60 hover:text-indigo-600 dark:hover:text-indigo-300 px-3.5 py-1.5 rounded-xl transition-colors border border-gray-300 dark:border-gray-700 text-[14px] font-semibold"

        function LondonExplorerApp() {
          const [areas, setAreas] = useState([]);
          const [currentView, setCurrentView] = useState('list');
          const [activeAreaId, setActiveAreaId] = useState(null);
          const [searchTerm, setSearchTerm] = useState('');
          const [selectedSeason, setSelectedSeason] = useState('All');
          const [theme, setTheme] = useState('system');
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [confirmModal, setConfirmModal] = useState({ show: false, type: null, areaId: null });
          const trackerRef = useRef(null);
          const fileInputRef = useRef(null);

          // Theme application
          useEffect(() => {
            const root = document.documentElement;
            const savedTheme = localStorage.getItem('londonExplorerTheme') || 'system';
            setTheme(savedTheme);

            const applyTheme = (currentTheme) => {
              if (currentTheme === 'dark') {
                root.classList.add('dark');
              } else if (currentTheme === 'light') {
                root.classList.remove('dark');
              } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                  root.classList.add('dark');
                } else {
                  root.classList.remove('dark');
                }
              }
            };
            applyTheme(savedTheme);
          }, []);

          const changeTheme = (newTheme) => {
            setTheme(newTheme);
            localStorage.setItem('londonExplorerTheme', newTheme);
            const root = document.documentElement;
            if (newTheme === 'dark') {
              root.classList.add('dark');
            } else if (newTheme === 'light') {
              root.classList.remove('dark');
            } else {
              if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                root.classList.add('dark');
              } else {
                root.classList.remove('dark');
              }
            }
          };

          // Load data from external london_data.json file with localStorage merge
          useEffect(() => {
            const loadData = async () => {
              try {
                const response = await fetch('./london_data.json');
                if (!response.ok) throw new Error('Failed to load london_data.json');
                let jsonData = await response.json();
                
                const savedProgress = localStorage.getItem('londonWeekendTrackerDataV35');
                if (savedProgress) {
                  const parsedSaved = JSON.parse(savedProgress);
                  jsonData = jsonData.map(area => {
                    const foundSaved = parsedSaved.find(s => s.id === area.id);
                    if (!foundSaved) return area;
                    return {
                      ...area,
                      visitedDate: foundSaved.visitedDate || '',
                      rating: foundSaved.rating || 0,
                      notes: foundSaved.notes || '',
                      todo: (area.todo || []).map(t => {
                        const matchT = foundSaved.todo?.find(st => st.id === t.id);
                        return matchT ? { ...t, checked: matchT.checked } : t;
                      }),
                      moreTodo: (area.moreTodo || []).map(m => {
                        const matchM = foundSaved.moreTodo?.find(sm => sm.id === m.id);
                        return matchM ? { ...m, checked: matchM.checked } : m;
                      }),
                      eat: (area.eat || []).map(e => {
                        const matchE = foundSaved.eat?.find(se => se.id === e.id);
                        return matchE ? { ...e, checked: matchE.checked } : e;
                      })
                    };
                  });
                }
                setAreas(jsonData);
              } catch (error) {
                console.warn("Could not load external london_data.json. Falling back to local data.", error);
                const savedData = localStorage.getItem('londonWeekendTrackerDataV35');
                if (savedData) {
                  setAreas(JSON.parse(savedData));
                } else {
                  setAreas(fallbackData);
                }
              }
            };
            loadData();
          }, []);

          useEffect(() => {
            if (areas.length > 0) {
              localStorage.setItem('londonWeekendTrackerDataV35', JSON.stringify(areas));
            }
          }, [areas]);

          const updateArea = (areaId, field, value) => {
            setAreas(prev => prev.map(a => a.id === areaId ? { ...a, [field]: value } : a));
          };

          const toggleCheck = (areaId, category, itemId) => {
            setAreas(prev => prev.map(a => {
              if (a.id !== areaId) return a;
              return {
                ...a,
                [category]: a[category].map(item => item.id === itemId ? { ...item, checked: !item.checked } : item)
              };
            }));
          };

          const openDetail = (id) => {
            setActiveAreaId(id);
            setCurrentView('detail');
            window.scrollTo(0, 0);
          };

          const goBack = () => {
            setCurrentView('list');
            setActiveAreaId(null);
            window.scrollTo(0, 0);
          };

          const scrollToTracker = () => {
            if (trackerRef.current) {
              trackerRef.current.scrollIntoView({ behavior: 'smooth' });
            }
          };

          const exportData = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem('londonWeekendTrackerDataV35') || JSON.stringify(areas));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "london_explorer_progress.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
          };

          const importData = (e) => {
            const fileReader = new FileReader();
            if (e.target.files[0]) {
              fileReader.readAsText(e.target.files[0], "UTF-8");
              fileReader.onload = (event) => {
                try {
                  const imported = JSON.parse(event.target.result);
                  if (Array.isArray(imported)) {
                    setAreas(imported);
                    localStorage.setItem('londonWeekendTrackerDataV35', JSON.stringify(imported));
                    alert("Progress imported successfully!");
                  }
                } catch (err) {
                  alert("Invalid JSON file format.");
                }
              };
            }
          };

          const resetAllData = () => {
            setAreas(prev => prev.map(a => ({
              ...a,
              visitedDate: '',
              rating: 0,
              notes: '',
              todo: (a.todo || []).map(t => ({ ...t, checked: false })),
              moreTodo: (a.moreTodo || []).map(m => ({ ...m, checked: false })),
              eat: (a.eat || []).map(e => ({ ...e, checked: false }))
            })));
            setConfirmModal({ show: false, type: null, areaId: null });
            setIsSettingsOpen(false);
          };

          const resetSingleArea = (areaId) => {
            setAreas(prev => prev.map(a => {
              if (a.id !== areaId) return a;
              return {
                ...a,
                visitedDate: '',
                rating: 0,
                notes: '',
                todo: (a.todo || []).map(t => ({ ...t, checked: false })),
                moreTodo: (a.moreTodo || []).map(m => ({ ...m, checked: false })),
                eat: (a.eat || []).map(e => ({ ...e, checked: false }))
              };
            }));
            setConfirmModal({ show: false, type: null, areaId: null });
          };

          const filteredAreas = useMemo(() => {
            return areas.filter(area => {
              const lowerSearch = searchTerm.toLowerCase();
              const matchesSearch = !searchTerm || 
                area.name.toLowerCase().includes(lowerSearch) || 
                area.soul.toLowerCase().includes(lowerSearch) ||
                area.season.toLowerCase().includes(lowerSearch);

              let matchesSeason = true;
              if (selectedSeason !== 'All') {
                const keywords = seasonKeywords[selectedSeason];
                const lowerAreaSeason = area.season.toLowerCase();
                matchesSeason = keywords.some(kw => lowerAreaSeason.includes(kw));
              }

              return matchesSearch && matchesSeason;
            });
          }, [areas, searchTerm, selectedSeason]);

          const activeArea = areas.find(a => a.id === activeAreaId);

                    {filteredAreas.length === 0 && (

                      const coreTodos = area.todo || [];

                            <div className="flex items-center space-x-2 mb-2">

                                isTwoDays
                                  ? 'bg-purple-100 text-purple-800 dark:bg-purple-950/60 dark:text-purple-300 border-purple-300 dark:border-purple-800/50'

                              <div className="flex items-center justify-between mb-1.5">

                                  Explore 🚀

                              )}
                            </div>
                          </div>
                        </div>
                      );

                  </div>
                </div>

                {/* Settings Modal */}

                        </button>
                      </div>

                      {/* Theme Toggle */}
                      <div>
                        <label className="block text-xs font-black uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-2.5">Theme Mode</label>
                        <div className="grid grid-cols-3 gap-2">

                            { id: 'light', label: 'Light ☀️' },
                            { id: 'dark', label: 'Dark 🌙' },
                            { id: 'system', label: 'System 💻' }

                            <button
                              key={t.id}
                              onClick={() => changeTheme(t.id)}
                              className={`py-2.5 px-3 rounded-2xl text-xs font-bold transition-all border ${theme === t.id ? 'bg-indigo-600 text-white border-transparent shadow-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-700 hover:bg-gray-200 dark:hover:bg-gray-700'}`}
                            >

                            <span>Export Progress</span>

                          <button
                            onClick={() => fileInputRef.current.click()}
                            className="flex items-center justify-center space-x-2 py-3 px-4 bg-gray-100 dark:bg-gray-800 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 text-gray-900 dark:text-white rounded-2xl text-xs font-bold border border-gray-300 dark:border-gray-700 transition-colors"
                          >
                            <span>📤</span>
                            <span>Import Progress</span>

                          <input

                            ref={fileInputRef}

                            className="hidden" 
                          />

                      <div className="pt-2 border-t border-gray-200 dark:border-gray-800">

                        </button>
                      </div>

                      <div className="text-center pt-2 text-xs font-bold text-gray-400 dark:text-gray-600">

                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          }

          if (currentView === 'detail' && activeArea) {
            const cleanAreaName = activeArea.name.replace(/[\u{1F600}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F300}-\u{1F5FF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]/gu, '').trim();

            return (

                    <div className="flex items-center overflow-hidden pr-2">
                      <button

                      >
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                      </button>
                      <h1 className="text-lg font-bold text-gray-900 dark:text-white truncate">{activeArea.name}</h1>
                      <a 
                        href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanAreaName + ', London')}`} 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        className="ml-2.5 flex-shrink-0 text-lg hover:scale-125 transition-transform" 
                        title="Search Area in Google Maps"

                    </div>
                  </div>
                </header>

                <div className="max-w-3xl mx-auto px-4 mt-4 space-y-4">

                  <div className={`rounded-3xl p-5 border shadow-xs ${
                    activeArea.durationRec?.includes('2')
                      ? 'bg-purple-100/90 dark:bg-purple-950/40 border-purple-300 dark:border-purple-900/60 text-purple-950 dark:text-purple-200'

                  }`}>
                    <div className="flex items-center mb-3">

                  </div>

                  <div className="grid sm:grid-cols-2 gap-3.5">
                    {/* Best Season */}

                      <div className="flex items-center mb-3">
                        <span className="text-lg mr-2.5">🌦️</span>
                        <h3 className="text-lg font-bold text-gray-900 dark:text-indigo-200">Best Season</h3>
                      </div>
                      <p className="text-[15px] font-normal text-gray-900 dark:text-indigo-200 leading-relaxed">{activeArea.season}</p>
                    </div>
                    
                    {/* Getting There */}
                    <div className="bg-sky-100/90 dark:bg-sky-950/40 border border-sky-300 dark:border-sky-900/60 rounded-3xl p-5 shadow-xs">
                      <div className="flex items-center mb-3">
                        <span className="text-lg mr-2.5">🚆</span>
                        <h3 className="text-lg font-bold text-gray-900 dark:text-sky-200">Getting There</h3>
                      </div>
                      <p className="text-[15px] font-normal text-gray-900 dark:text-sky-200 leading-relaxed">{activeArea.transport}</p>
                    </div>
                  </div>

                  {/* The Soul */}
                  <div className="bg-orange-100/90 dark:bg-orange-950/40 border border-orange-300 dark:border-orange-900/60 rounded-3xl p-5 shadow-xs">

                      <span className="text-lg mr-2.5">✨</span>
                      <h3 className="text-lg font-bold text-gray-900 dark:text-orange-200">The Soul</h3>
                    </div>
                    <p className="text-[15px] font-normal text-gray-900 dark:text-orange-200 leading-relaxed">{activeArea.soul}</p>
                  </div>
                  
                  {/* Virtual Tour Guide */}
                  {activeArea.funFacts && activeArea.funFacts.length > 0 && (
                    <div className="bg-emerald-100/90 dark:bg-emerald-950/40 border border-emerald-300 dark:border-emerald-900/60 rounded-3xl p-5 shadow-xs">
                      <div className="flex items-center mb-3">
                        <span className="text-lg mr-2.5">💡</span>
                        <h3 className="text-lg font-bold text-gray-900 dark:text-emerald-200">Virtual Tour Guide</h3>
                      </div>
                      <ul className="space-y-2">
                        {activeArea.funFacts.map((fact, idx) => (
                          <li key={idx} className="text-[15px] font-normal text-gray-900 dark:text-emerald-200 leading-relaxed flex items-start">
                            <span className="mr-2 text-emerald-700 dark:text-emerald-400">•</span>
                            <span>{fact}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Things to Do */}
                  <div className="mt-6 pt-2">
                    <div className="flex items-center mb-2 px-1">
                      <span className="text-lg mr-3">📍</span>
                      <h3 className="text-xl font-bold text-gray-900 dark:text-gray-100">Things to Do</h3>
                    </div>
                    <div>
                      {activeArea.todo && activeArea.todo.map(item => (
                        <ChecklistItem 
                          key={item.id} 
                          item={item} 
                          onToggle={(itemId) => toggleCheck(activeArea.id, 'todo', itemId)}
                          areaName={activeArea.name}
                        />
                      ))}
                    </div>

                    {/* If You Have More Time Sub-section */}
                    {activeArea.moreTodo && activeArea.moreTodo.length > 0 && (
                      <div className="mt-8 pt-6 border-t border-gray-200 dark:border-gray-800">

                          <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">

                        <div>
                          {activeArea.moreTodo.map(item => (

                              key={item.id}

                            />

                        </div>
                      </div>
                    )}
                  </div>

                  {/* Eateries */}

                    <div className="flex items-center mb-2 px-1">
                      <span className="text-lg mr-3">🥑</span>
                      <h3 className="text-xl font-bold text-gray-900 dark:text-gray-100">Eateries (Veg + GF Friendly)</h3>
                    </div>

                      {activeArea.eat && activeArea.eat.map(item => (
                        <ChecklistItem 
                          key={item.id} 
                          item={item} 
                          onToggle={(itemId) => toggleCheck(activeArea.id, 'eat', itemId)}
                          areaName={activeArea.name}
                          isEatery={true}
                        />
                      ))}
                    </div>
                  </div>

                  {/* Tracker Section */}
                  <div ref={trackerRef} className="bg-white dark:bg-gray-900 rounded-3xl shadow-sm border border-gray-300 dark:border-gray-800 p-6 scroll-mt-24 mt-6">

                      </div>
                      <button
                        onClick={() => setConfirmModal({ show: true, type: 'single', areaId: activeArea.id })}
                        className="px-3.5 py-1.5 bg-rose-50 dark:bg-rose-950/30 hover:bg-rose-100 dark:hover:bg-rose-900/40 text-rose-600 dark:text-rose-400 rounded-xl text-xs font-bold border border-rose-200 dark:border-rose-900/50 transition-colors"
                      >
                        Reset Area
                      </button>
                    </div>
                    
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-5 space-y-4 sm:space-y-0">
                      <div className="flex-1 sm:mr-4">
                        <label className="block text-xs font-black uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-2">Date Visited 📅</label>
                        <input 
                          type="date" 
                          value={activeArea.visitedDate}
                          onChange={(e) => updateArea(activeArea.id, 'visitedDate', e.target.value)}
                          className="w-full sm:w-auto px-4 py-2.5 bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 rounded-xl text-sm font-bold focus:ring-2 focus:ring-indigo-600 dark:focus:ring-indigo-500 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-2">Overall Rating ⭐</label>
                        <StarRating 
                          rating={activeArea.rating} 
                          onChange={(val) => updateArea(activeArea.id, 'rating', val)} 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-black uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-2">Personal Notes 💭</label>
                      <textarea 
                        value={activeArea.notes}
                        onChange={(e) => updateArea(activeArea.id, 'notes', e.target.value)}
                        placeholder="Write your memories, favorite moments, or things to remember..."
                        className="w-full px-4 py-3 bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 rounded-2xl text-sm font-normal focus:ring-2 focus:ring-indigo-600 dark:focus:ring-indigo-500 outline-none min-h-[120px] resize-y placeholder-gray-500 dark:placeholder-gray-400"
                      />
                    </div>
                  </div>

                </div>

                {/* Custom Confirmation Modal */}
                {confirmModal.show && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
                    <div className="bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-5 text-center">
                      <div className="text-4xl">⚠️</div>
                      <h4 className="text-lg font-bold text-gray-900 dark:text-white">
                        {confirmModal.type === 'single' ? 'Reset Neighbourhood?' : 'Reset All Progress?'}
                      </h4>
                      <p className="text-sm text-gray-600 dark:text-gray-400">
                        {confirmModal.type === 'single' 
                          ? 'This will clear all checkboxes, ratings, dates, and notes for this area.' 
                          : 'This will wipe all progress, checklists, and tracker details across every neighbourhood in the app.'}
                      </p>
                      <div className="grid grid-cols-2 gap-3 pt-2">
                        <button
                          onClick={() => setConfirmModal({ show: false, type: null, areaId: null })}
                          className="py-3 px-4 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-2xl text-xs font-bold transition-colors"
                        >
                          Cancel
                        </button>
                        <button
                          onClick={() => {
                            if (confirmModal.type === 'single') {
                              resetSingleArea(confirmModal.areaId);
                            } else {
                              resetAllData();
                            }
                          }}
                          className="py-3 px-4 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl text-xs font-bold transition-colors shadow-md"
                        >
                          Yes, Reset
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          }

          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LondonExplorerApp />);
    </script>
</body>
