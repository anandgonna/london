        function LondonExplorerApp() {
          const [areas, setAreas] = useState([]);
          const [currentView, setCurrentView] = useState('list'); // 'list' | 'detail'
          const [activeAreaId, setActiveAreaId] = useState(null);
          
          const [searchTerm, setSearchTerm] = useState('');
          const [selectedSeason, setSelectedSeason] = useState('All');

          // Load from local storage or initialize
          useEffect(() => {
            const savedData = localStorage.getItem('londonWeekendTrackerDataV2');
            if (savedData) {
              setAreas(JSON.parse(savedData));
            } else {
              setAreas(initialData);
            }
          }, []);

          // Save to local storage whenever areas change
          useEffect(() => {
            if (areas.length > 0) {
              localStorage.setItem('londonWeekendTrackerDataV2', JSON.stringify(areas));
            }
          }, [areas]);

          // General Updater
          const updateArea = (areaId, field, value) => {
            setAreas(prev => prev.map(a => a.id === areaId ? { ...a, [field]: value } : a));
          };

          const toggleCheck = (areaId, category, itemId) => {
            setAreas(prev => prev.map(a => {
              if (a.id !== areaId) return a;
              return {
                ...a,
                [category]: a[category].map(item => item.id === itemId ? { ...item, checked: !item.checked } : item)
              };
            }));
          };

          const reorderList = (areaId, category, index, direction) => {
            setAreas(prev => prev.map(a => {
              if (a.id !== areaId) return a;
              const newList = [...a[category]];
              const targetIndex = direction === 'up' ? index - 1 : index + 1;
              
              const temp = newList[index];
              newList[index] = newList[targetIndex];
              newList[targetIndex] = temp;
              
              return { ...a, [category]: newList };
            }));
          };

          // View Controllers
          const openDetail = (id) => {
            setActiveAreaId(id);
            setCurrentView('detail');
            window.scrollTo(0,0);
          };

          const goBack = () => {
            setCurrentView('list');
            setActiveAreaId(null);
            window.scrollTo(0,0);
          };

          const filteredAreas = useMemo(() => {
            return areas.filter(area => {
              const lowerSearch = searchTerm.toLowerCase();
              const matchesSearch = !searchTerm || 
                area.name.toLowerCase().includes(lowerSearch) || 
                area.soul.toLowerCase().includes(lowerSearch) ||
                area.season.toLowerCase().includes(lowerSearch);

              let matchesSeason = true;
              if (selectedSeason !== 'All') {
                const keywords = seasonKeywords[selectedSeason];
                const lowerAreaSeason = area.season.toLowerCase();
                matchesSeason = keywords.some(kw => lowerAreaSeason.includes(kw));
              }

              return matchesSearch && matchesSeason;
            });
          }, [areas, searchTerm, selectedSeason]);

          const activeArea = areas.find(a => a.id === activeAreaId);
          const visitedCount = areas.filter(a => a.visitedDate !== '' || a.rating > 0).length;

          if (currentView === 'list') {
            return (
              <div className="min-h-screen bg-[#F4F5F8] font-sans pb-12 selection:bg-indigo-200">

                    </div>
                    <input 
                      type="text" 
                      placeholder="Search neighbourhoods, vibes, or seasons..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-12 pr-4 py-4 bg-[#E2E4E9] text-gray-900 rounded-full font-medium placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#4F46E5] transition-all"

                  </div>

                  <div className="flex space-x-2 overflow-x-auto pb-6 scrollbar-hide">
                    {['All', 'Spring', 'Summer', 'Autumn', 'Winter'].map(season => (
                      <button
                        key={season}
                        onClick={() => setSelectedSeason(season)}
                        className={`px-5 py-2 rounded-full whitespace-nowrap text-sm font-bold transition-all duration-300 ${

                    {filteredAreas.map(area => {
                      const isVisited = area.visitedDate !== '' || area.rating > 0;
                      const totalTasks = area.todo.length + area.photo.length + area.eat.length;
                      const completedTasks = [...area.todo, ...area.photo, ...area.eat].filter(i => i.checked).length;
                      const progressPercentage = Math.round((completedTasks / totalTasks) * 100);

                      return (
                        <div 
                          key={area.id} 
                          onClick={() => openDetail(area.id)}
                          className="bg-white rounded-[24px] shadow-sm hover:shadow-md border border-gray-100/50 p-5 cursor-pointer transition-all duration-300 relative overflow-hidden group flex flex-col justify-between"
                        >
                          {isVisited && (
                            <div className="absolute top-0 right-0 bg-[#10B981] text-white text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-bl-xl">
                              Visited
                            </div>
                          )}
                          
                          <div>
                            <h2 className="text-[19px] font-bold text-gray-900 pr-10 mb-1 group-hover:text-[#4F46E5] transition-colors">{area.name}</h2>
                            <p className="text-sm text-gray-500 line-clamp-2 mt-1 leading-relaxed font-medium">
                              {area.soul}
                            </p>
                          </div>
                          
                          <div className="flex justify-between items-end mt-5">
                            <div className="w-[55%]">
                              <div className="flex justify-between text-xs text-gray-500 mb-1.5 font-bold">
                                <span>Checklist</span>
                                <span>{progressPercentage}%</span>
                              </div>
                              <div className="w-full bg-[#E2E4E9] rounded-full h-2">
                                <div className={`h-2 rounded-full transition-all duration-500 ${progressPercentage === 100 ? 'bg-[#10B981]' : 'bg-[#4F46E5]'}`} style={{ width: `${progressPercentage}%` }}></div>
                              </div>
                            </div>
                            
                            <div className="flex-shrink-0">
                              {isVisited ? (
                                 <StarRating rating={area.rating} readOnly={true} />
                              ) : (
                                <span className="bg-[#F0F2F5] text-gray-600 px-3 py-1.5 rounded-full text-xs font-bold group-hover:bg-[#E0E7FF] group-hover:text-[#4F46E5] transition-colors">
                                  Explore →
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            );
          }

          if (currentView === 'detail' && activeArea) {
            return (
              <div className="min-h-screen bg-[#F4F5F8] font-sans pb-24 selection:bg-indigo-200">
                <header className="bg-[#F4F5F8] sticky top-0 z-20 pt-4 pb-2 px-4 transition-all">
                  <div className="max-w-2xl mx-auto flex items-center">
                    <button 
                      onClick={goBack}
                      className="mr-3 p-2 bg-white rounded-full shadow-sm hover:shadow-md hover:bg-gray-50 transition-all text-gray-700"
                    >
                      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    </button>
                    <h1 className="text-xl font-bold text-gray-900 truncate pl-2">{activeArea.name}</h1>
                  </div>
                </header>

                <div className="max-w-2xl mx-auto px-4 mt-4">
                  <div className="bg-white rounded-[28px] shadow-sm border border-gray-100 p-6 mb-8">
                    <h3 className="text-[13px] font-black uppercase tracking-widest text-[#4F46E5] mb-5 flex items-center">
                      <svg className="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      Your Tracker
                    </h3>
                    
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-5 space-y-4 sm:space-y-0">
                      <div className="flex-1 mr-4">
                        <label className="block text-sm font-bold text-gray-700 mb-2">Date Visited</label>
                        <input 
                          type="date" 
                          value={activeArea.visitedDate}
                          onChange={(e) => updateArea(activeArea.id, 'visitedDate', e.target.value)}
                          className="w-full sm:w-auto px-4 py-2.5 bg-[#F0F2F5] text-gray-900 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-[#4F46E5] focus:bg-white transition-all outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-2">Overall Rating</label>
                        <StarRating 
                          rating={activeArea.rating} 
                          onChange={(val) => updateArea(activeArea.id, 'rating', val)} 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">Personal Notes</label>
                      <textarea 
                        value={activeArea.notes}
                        onChange={(e) => updateArea(activeArea.id, 'notes', e.target.value)}
                        placeholder="Write your memories, favorite moments, or things to remember..."
                        className="w-full px-4 py-3 bg-[#F0F2F5] text-gray-900 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-[#4F46E5] focus:bg-white transition-all outline-none min-h-[120px] resize-y"
                      />
                    </div>
                  </div>

                  <div className="grid sm:grid-cols-2 gap-4 mb-8">
                    <div className="bg-[#E0E7FF] rounded-[24px] p-5">
                      <h4 className="text-xs font-black uppercase tracking-widest text-[#4F46E5] mb-2 flex items-center">
                        <svg className="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        Best Season
                      </h4>
                      <p className="text-[15px] font-medium text-[#3730A3] leading-relaxed">{activeArea.season}</p>
                    </div>
                    
                    <div className="bg-[#FFEDD5] rounded-[24px] p-5">
                      <h4 className="text-xs font-black uppercase tracking-widest text-[#EA580C] mb-2 flex items-center">
                        <svg className="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                        The Soul
                      </h4>
                      <p className="text-[15px] font-medium text-[#9A3412] leading-relaxed">{activeArea.soul}</p>
                    </div>
                  </div>

                  <div className="bg-white rounded-[28px] shadow-sm border border-gray-100 p-2 pt-6 sm:p-6 mb-8">
                    <ChecklistGroup 
                      title="Things to Do" 
                      items={activeArea.todo} 
                      icon={<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>}
                      onToggle={(itemId) => toggleCheck(activeArea.id, 'todo', itemId)}
                      onMoveUp={(idx) => reorderList(activeArea.id, 'todo', idx, 'up')}
                      onMoveDown={(idx) => reorderList(activeArea.id, 'todo', idx, 'down')}
                    />

                    <ChecklistGroup 
                      title="Photography Hotspots" 
                      items={activeArea.photo} 
                      icon={<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>}
                      onToggle={(itemId) => toggleCheck(activeArea.id, 'photo', itemId)}
                      onMoveUp={(idx) => reorderList(activeArea.id, 'photo', idx, 'up')}
                      onMoveDown={(idx) => reorderList(activeArea.id, 'photo', idx, 'down')}
                    />

                    <ChecklistGroup 
                      title="Eateries (Veg + GF Friendly)" 
                      items={activeArea.eat} 
                      icon={<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg>}
                      onToggle={(itemId) => toggleCheck(activeArea.id, 'eat', itemId)}
                      onMoveUp={(idx) => reorderList(activeArea.id, 'eat', idx, 'up')}
                      onMoveDown={(idx) => reorderList(activeArea.id, 'eat', idx, 'down')}
                    />
                  </div>

                  <div className="bg-[#F3E8FF] rounded-[24px] p-6 shadow-sm border border-purple-100">
                    <h4 className="text-xs font-black uppercase tracking-widest text-[#7E22CE] mb-3 flex items-center">
                      <svg className="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      Weekend Extension (Day 2)
                    </h4>
                    <p className="text-[15px] font-medium text-[#581C87] leading-relaxed">{activeArea.day2}</p>
                  </div>

                </div>
              </div>
            );
          }

          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LondonExplorerApp />);
    </script>
</body>
</html>
